name: Release Container Image

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate and Publish Release Image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Validate release version
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! "$RELEASE_VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid stable release version: $RELEASE_VERSION"
            echo "Expected: vMAJOR.MINOR.PATCH without leading zeroes."
            exit 1
          fi

          echo "Release version accepted: $RELEASE_VERSION"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Prepare image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/pavankumar-18o3/aws-cloud-operations-platform
          tags: |
            type=ref,event=tag
            type=sha,format=short

      - name: Preflight GHCR release aliases
        env:
          RELEASE_IMAGE: ghcr.io/pavankumar-18o3/aws-cloud-operations-platform
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        shell: bash
        run: bash scripts/check-ghcr-release-aliases.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build release candidate
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: cop-release:candidate
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate candidate container
        shell: bash
        run: |
          set -euo pipefail

          CONTAINER="cop-release-${GITHUB_RUN_ID}"
          PORT=13001

          cleanup() {
            docker logs "$CONTAINER" 2>&1 || true
            docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d \
            --name "$CONTAINER" \
            -p "127.0.0.1:${PORT}:3000" \
            cop-release:candidate

          for attempt in $(seq 1 30); do
            if ! docker inspect -f '{{.State.Running}}' "$CONTAINER" 2>/dev/null | grep -qx true; then
              echo "Container stopped unexpectedly."
              exit 1
            fi

            if curl --fail --silent --show-error \
              --max-time 2 \
              "http://127.0.0.1:${PORT}/health"; then
              echo
              echo "Release candidate health check PASSED."
              exit 0
            fi

            sleep 2
          done

          echo "Release candidate health check timed out."
          exit 1

      - name: Record candidate image ID
        id: image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_ID="$(docker image inspect cop-release:candidate --format '{{.Id}}')"
          echo "id=$IMAGE_ID" >> "$GITHUB_OUTPUT"
          echo "Validated image ID: $IMAGE_ID"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish validated image and capture digest
        id: published
        env:
          RELEASE_IMAGE: ghcr.io/pavankumar-18o3/aws-cloud-operations-platform
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          EXPECTED_IMAGE_ID: ${{ steps.image.outputs.id }}
          RUN_TAG: ci-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -Eeuo pipefail

          UNIQUE_REF="${RELEASE_IMAGE}:${RUN_TAG}"

          # Publish the exact local candidate under a run-specific tag.
          docker tag cop-release:candidate "$UNIQUE_REF"

          PUSH_LOG="$(mktemp)"
          trap 'rm -f "$PUSH_LOG"' EXIT

          docker push "$UNIQUE_REF" 2>&1 | tee "$PUSH_LOG"

          DIGEST="$(sed -nE \
            's/.*digest: (sha256:[a-f0-9]{64}).*/\1/p' \
            "$PUSH_LOG" | tail -n 1)"

          if [[ ! "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Could not capture a valid push digest."
            exit 1
          fi

          IMMUTABLE_REF="${RELEASE_IMAGE}@${DIGEST}"

          # Confirm the registry artifact matches the candidate.
          docker pull "$IMMUTABLE_REF"

          PULLED_IMAGE_ID="$(docker image inspect \
            "$IMMUTABLE_REF" --format '{{.Id}}')"

          if [[ "$PULLED_IMAGE_ID" != "$EXPECTED_IMAGE_ID" ]]; then
            echo "Published image does not match tested candidate."
            echo "Expected: $EXPECTED_IMAGE_ID"
            echo "Actual:   $PULLED_IMAGE_ID"
            exit 1
          fi

          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "image_ref=$IMMUTABLE_REF" >> "$GITHUB_OUTPUT"

          echo "Verified candidate image ID: $PULLED_IMAGE_ID"
          echo "Published digest: $DIGEST"
          echo "Immutable reference: $IMMUTABLE_REF"
          echo "Published aliases:"
          printf '%s\n' "$IMAGE_TAGS"

      - name: Verify published image by digest
        id: verify_published
        env:
          IMMUTABLE_IMAGE: ${{ steps.published.outputs.image_ref }}
          EXPECTED_DIGEST: ${{ steps.published.outputs.digest }}
          EXPECTED_IMAGE_ID: ${{ steps.image.outputs.id }}
        shell: bash
        run: |
          set -Eeuo pipefail

          CONTAINER="cop-published-${GITHUB_RUN_ID}"
          PORT=13002

          cleanup() {
            docker logs "$CONTAINER" 2>&1 || true
            docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          [[ "$IMMUTABLE_IMAGE" == *"@${EXPECTED_DIGEST}" ]] || {
            echo "Immutable reference and expected digest do not match."
            exit 1
          }

          echo "Pulling immutable release: $IMMUTABLE_IMAGE"
          docker pull "$IMMUTABLE_IMAGE"

          PULLED_IMAGE_ID="$(docker image inspect \
            "$IMMUTABLE_IMAGE" --format '{{.Id}}')"

          if [[ "$PULLED_IMAGE_ID" != "$EXPECTED_IMAGE_ID" ]]; then
            echo "Published image does not match tested candidate."
            echo "Expected: $EXPECTED_IMAGE_ID"
            echo "Actual:   $PULLED_IMAGE_ID"
            exit 1
          fi

          echo "Published image matches tested candidate."

          docker run -d \
            --name "$CONTAINER" \
            -p "127.0.0.1:${PORT}:3000" \
            "$IMMUTABLE_IMAGE"

          ACTUAL_IMAGE_ID="$(docker inspect "$CONTAINER" --format '{{.Image}}')"
          PULLED_IMAGE_ID="$(docker image inspect "$IMMUTABLE_IMAGE" --format '{{.Id}}')"

          [[ "$ACTUAL_IMAGE_ID" == "$PULLED_IMAGE_ID" ]] || {
            echo "Container image identity verification failed."
            exit 1
          }

          for attempt in $(seq 1 30); do
            if ! docker inspect -f '{{.State.Running}}' \
              "$CONTAINER" 2>/dev/null | grep -qx true; then
              echo "Published container stopped unexpectedly."
              exit 1
            fi

            RESPONSE="$(curl --fail --silent \
              --max-time 2 \
              "http://127.0.0.1:${PORT}/health" || true)"

            if [[ -n "$RESPONSE" ]] &&
              node -e '
                let input = "";
                process.stdin.on("data", d => input += d);
                process.stdin.on("end", () => {
                  try {
                    const body = JSON.parse(input);
                    if (body.status !== "healthy" ||
                        body.service !== "cloud-operations-platform") {
                      process.exit(1);
                    }
                  } catch {
                    process.exit(1);
                  }
                });
              ' <<< "$RESPONSE"; then
              echo "Published immutable image verification PASSED."
              echo "Verified container image ID: $ACTUAL_IMAGE_ID"
              echo "Verified release digest: $EXPECTED_DIGEST"
              exit 0
            fi

            sleep 2
          done

          echo "Published image health verification timed out."
          exit 1

      - name: Publish and verify release aliases
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMMUTABLE_IMAGE: ${{ steps.published.outputs.image_ref }}
          EXPECTED_DIGEST: ${{ steps.published.outputs.digest }}
        shell: bash
        run: |
          set -Eeuo pipefail

          [[ "$IMMUTABLE_IMAGE" == *"@${EXPECTED_DIGEST}" ]] || {
            echo "Immutable image reference does not match expected digest."
            exit 1
          }

          # Reached only after immutable image health verification succeeds.
          docker pull "$IMMUTABLE_IMAGE"

          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue

            echo "Publishing alias: $tag"
            docker tag "$IMMUTABLE_IMAGE" "$tag"
            docker push "$tag"

            INSPECT_OUTPUT="$(docker buildx imagetools inspect "$tag")"
            ACTUAL_DIGEST="$(printf '%s\n' "$INSPECT_OUTPUT" |
              sed -nE 's/^Digest:[[:space:]]*(sha256:[a-f0-9]{64})$/\1/p' |
              head -n 1)"

            if [[ "$ACTUAL_DIGEST" != "$EXPECTED_DIGEST" ]]; then
              echo "Alias digest verification failed: $tag"
              echo "Expected: $EXPECTED_DIGEST"
              echo "Actual:   ${ACTUAL_DIGEST:-unavailable}"
              exit 1
            fi

            echo "Verified alias digest: $tag -> $ACTUAL_DIGEST"
          done <<< "$IMAGE_TAGS"

          echo "All release aliases verified."

      - name: Generate signed image provenance
        id: attest
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/pavankumar-18o3/aws-cloud-operations-platform
          subject-digest: ${{ steps.published.outputs.digest }}
          push-to-registry: true

      - name: Write release summary
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_DIGEST: ${{ steps.published.outputs.digest }}
          RELEASE_IMAGE_REF: ${{ steps.published.outputs.image_ref }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Container Release"
            echo
            echo "- **Version:** \`${RELEASE_VERSION}\`"
            echo "- **Commit:** \`${RELEASE_COMMIT}\`"
            echo "- **Image digest:** \`${RELEASE_DIGEST}\`"
            echo "- **Immutable image:** \`${RELEASE_IMAGE_REF}\`"
            echo
            echo "The candidate passed its health check, and the published immutable image passed post-publication verification."
          } >> "$GITHUB_STEP_SUMMARY"
