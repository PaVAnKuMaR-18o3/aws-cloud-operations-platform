name: Release Container Image

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  release:
    name: Validate and Publish Release Image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Prepare image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/pavankumar-18o3/aws-cloud-operations-platform
          tags: |
            type=ref,event=tag
            type=sha,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build release candidate
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: cop-release:candidate
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate candidate container
        shell: bash
        run: |
          set -euo pipefail

          CONTAINER="cop-release-${GITHUB_RUN_ID}"
          PORT=13001

          cleanup() {
            docker logs "$CONTAINER" 2>&1 || true
            docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d \
            --name "$CONTAINER" \
            -p "127.0.0.1:${PORT}:3000" \
            cop-release:candidate

          for attempt in $(seq 1 30); do
            if ! docker inspect -f '{{.State.Running}}' "$CONTAINER" 2>/dev/null | grep -qx true; then
              echo "Container stopped unexpectedly."
              exit 1
            fi

            if curl --fail --silent --show-error \
              --max-time 2 \
              "http://127.0.0.1:${PORT}/health"; then
              echo
              echo "Release health check PASSED."
              exit 0
            fi

            sleep 2
          done

          echo "Release health check timed out."
          exit 1

      - name: Record candidate image ID
        id: image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_ID="$(docker image inspect cop-release:candidate --format '{{.Id}}')"
          echo "id=$IMAGE_ID" >> "$GITHUB_OUTPUT"
          echo "Validated image ID: $IMAGE_ID"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and publish validated image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          EXPECTED_IMAGE_ID: ${{ steps.image.outputs.id }}
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            docker tag cop-release:candidate "$tag"
          done <<< "$IMAGE_TAGS"

          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            docker push "$tag"
          done <<< "$IMAGE_TAGS"

          echo "Validated image ID: $EXPECTED_IMAGE_ID"
          echo "Published release tags:"
          printf '%s\n' "$IMAGE_TAGS"
