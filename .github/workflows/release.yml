name: Release Container Image

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate and Publish Release Image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Prepare image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/pavankumar-18o3/aws-cloud-operations-platform
          tags: |
            type=ref,event=tag
            type=sha,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build release candidate
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: cop-release:candidate
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate candidate container
        shell: bash
        run: |
          set -euo pipefail

          CONTAINER="cop-release-${GITHUB_RUN_ID}"
          PORT=13001

          cleanup() {
            docker logs "$CONTAINER" 2>&1 || true
            docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d \
            --name "$CONTAINER" \
            -p "127.0.0.1:${PORT}:3000" \
            cop-release:candidate

          for attempt in $(seq 1 30); do
            if ! docker inspect -f '{{.State.Running}}' "$CONTAINER" 2>/dev/null | grep -qx true; then
              echo "Container stopped unexpectedly."
              exit 1
            fi

            if curl --fail --silent --show-error \
              --max-time 2 \
              "http://127.0.0.1:${PORT}/health"; then
              echo
              echo "Release candidate health check PASSED."
              exit 0
            fi

            sleep 2
          done

          echo "Release candidate health check timed out."
          exit 1

      - name: Record candidate image ID
        id: image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_ID="$(docker image inspect cop-release:candidate --format '{{.Id}}')"
          echo "id=$IMAGE_ID" >> "$GITHUB_OUTPUT"
          echo "Validated image ID: $IMAGE_ID"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and publish validated image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          EXPECTED_IMAGE_ID: ${{ steps.image.outputs.id }}
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            docker tag cop-release:candidate "$tag"
          done <<< "$IMAGE_TAGS"

          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            docker push "$tag"
          done <<< "$IMAGE_TAGS"

          echo "Validated image ID: $EXPECTED_IMAGE_ID"
          echo "Published release tags:"
          printf '%s\n' "$IMAGE_TAGS"

      - name: Capture published image digest
        id: published
        env:
          RELEASE_IMAGE: ghcr.io/pavankumar-18o3/aws-cloud-operations-platform
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_REF="${RELEASE_IMAGE}:${RELEASE_TAG}"

          DIGEST="$(docker buildx imagetools inspect \
            "$IMAGE_REF" \
            --format '{{.Manifest.Digest}}')"

          if [[ ! "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Invalid registry digest: $DIGEST"
            exit 1
          fi

          IMMUTABLE_REF="${RELEASE_IMAGE}@${DIGEST}"

          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "image_ref=$IMMUTABLE_REF" >> "$GITHUB_OUTPUT"

          echo "Published image digest: $DIGEST"
          echo "Immutable image reference: $IMMUTABLE_REF"

      - name: Verify published image by digest
        id: verify_published
        env:
          IMMUTABLE_IMAGE: ${{ steps.published.outputs.image_ref }}
          EXPECTED_DIGEST: ${{ steps.published.outputs.digest }}
        shell: bash
        run: |
          set -Eeuo pipefail

          CONTAINER="cop-published-${GITHUB_RUN_ID}"
          PORT=13002

          cleanup() {
            docker logs "$CONTAINER" 2>&1 || true
            docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          [[ "$IMMUTABLE_IMAGE" == *"@${EXPECTED_DIGEST}" ]] || {
            echo "Immutable reference and expected digest do not match."
            exit 1
          }

          echo "Pulling immutable release: $IMMUTABLE_IMAGE"
          docker pull "$IMMUTABLE_IMAGE"

          docker run -d \
            --name "$CONTAINER" \
            -p "127.0.0.1:${PORT}:3000" \
            "$IMMUTABLE_IMAGE"

          ACTUAL_IMAGE_ID="$(docker inspect "$CONTAINER" --format '{{.Image}}')"
          PULLED_IMAGE_ID="$(docker image inspect "$IMMUTABLE_IMAGE" --format '{{.Id}}')"

          [[ "$ACTUAL_IMAGE_ID" == "$PULLED_IMAGE_ID" ]] || {
            echo "Container image identity verification failed."
            exit 1
          }

          for attempt in $(seq 1 30); do
            if ! docker inspect -f '{{.State.Running}}' \
              "$CONTAINER" 2>/dev/null | grep -qx true; then
              echo "Published container stopped unexpectedly."
              exit 1
            fi

            RESPONSE="$(curl --fail --silent \
              --max-time 2 \
              "http://127.0.0.1:${PORT}/health" || true)"

            if [[ -n "$RESPONSE" ]] &&
              node -e '
                let input = "";
                process.stdin.on("data", d => input += d);
                process.stdin.on("end", () => {
                  try {
                    const body = JSON.parse(input);
                    if (body.status !== "healthy" ||
                        body.service !== "cloud-operations-platform") {
                      process.exit(1);
                    }
                  } catch {
                    process.exit(1);
                  }
                });
              ' <<< "$RESPONSE"; then
              echo "Published immutable image verification PASSED."
              echo "Verified container image ID: $ACTUAL_IMAGE_ID"
              echo "Verified release digest: $EXPECTED_DIGEST"
              exit 0
            fi

            sleep 2
          done

          echo "Published image health verification timed out."
          exit 1

      - name: Write release summary
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_DIGEST: ${{ steps.published.outputs.digest }}
          RELEASE_IMAGE_REF: ${{ steps.published.outputs.image_ref }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Container Release"
            echo
            echo "- **Version:** \`${RELEASE_VERSION}\`"
            echo "- **Commit:** \`${RELEASE_COMMIT}\`"
            echo "- **Image digest:** \`${RELEASE_DIGEST}\`"
            echo "- **Immutable image:** \`${RELEASE_IMAGE_REF}\`"
            echo
            echo "The candidate passed its health check, and the published immutable image passed post-publication verification."
          } >> "$GITHUB_STEP_SUMMARY"
